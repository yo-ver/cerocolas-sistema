# Canalizacion CI/CD del Sistema Cero Colas
# ---------------------------------------------------------------------------
# Etapa 1 (calidad)  : analisis estatico con ruff sobre backend y agente.
# Etapa 2 (backend)  : pruebas unitarias, de integracion y cobertura de ramas
#                      con umbral minimo, sobre una matriz de versiones.
# Etapa 3 (agente)   : misma estrategia sobre el agente de vision.
# Etapa 4 (tablero)  : verificacion de tipos y construccion del frontend.
# Etapa 5 (publicar) : imagen Docker de la API publicada en ghcr.io.
#
# El proyecto es academico y su codigo se distribuye bajo AGPL-3.0, por lo que
# la publicacion del repositorio y de la imagen no genera obligaciones
# adicionales.
# ---------------------------------------------------------------------------
name: Test and Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Permisos minimos: leer el codigo y escribir paquetes en GHCR.
permissions:
  contents: read
  packages: write

# Un solo pipeline activo por rama: los push sucesivos cancelan el anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UMBRAL_COBERTURA_BACKEND: "90"
  UMBRAL_COBERTURA_AGENTE: "80"
  VERSION_PYTHON_PRINCIPAL: "3.12"

jobs:
  # -------------------------------------------------------------------------
  calidad:
    name: Análisis estático (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSION_PYTHON_PRINCIPAL }}
          cache: pip

      - name: Instalar ruff
        run: pip install ruff==0.8.4

      - name: Verificar reglas de lint del backend
        run: ruff check --output-format=github .
        working-directory: backend

      - name: Verificar formato del backend
        run: ruff format --check .
        working-directory: backend

      - name: Verificar reglas de lint del agente
        run: ruff check --output-format=github .
        working-directory: agente

      - name: Verificar formato del agente
        run: ruff format --check .
        working-directory: agente

  # -------------------------------------------------------------------------
  backend:
    name: Backend — pruebas y cobertura (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: calidad
    defaults:
      run:
        working-directory: backend
    strategy:
      # Sin detencion temprana: si el fallo ocurre en una sola version, hay
      # que poder distinguir un defecto general de un problema de
      # compatibilidad.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas unitarias
        run: pytest -m unitaria -v

      - name: Pruebas de integración
        run: pytest -m integracion -v

      - name: Suite completa con cobertura de ramas
        run: |
          pytest \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --cov-fail-under=${{ env.UMBRAL_COBERTURA_BACKEND }} \
            tests/

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          {
            echo "### Cobertura del backend — Python ${{ matrix.python-version }}"
            echo ""
            echo '```'
            coverage report --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archivar reportes de cobertura
        if: matrix.python-version == env.VERSION_PYTHON_PRINCIPAL
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 14

  # -------------------------------------------------------------------------
  agente:
    name: Agente de visión — pruebas y cobertura
    runs-on: ubuntu-latest
    needs: calidad
    defaults:
      run:
        working-directory: agente

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSION_PYTHON_PRINCIPAL }}
          cache: pip

      # Se instalan solo las dependencias del núcleo: ultralytics y torch pesan
      # más de un gigabyte y la suite no los necesita, porque la lógica de
      # conteo se prueba con el detector simulado.
      - name: Instalar dependencias del núcleo
        run: pip install httpx PyYAML opencv-python-headless pytest pytest-cov

      - name: Pruebas unitarias
        run: pytest -m unitaria -v

      - name: Pruebas de integración
        run: pytest -m integracion -v

      - name: Suite completa con cobertura de ramas
        run: |
          pytest \
            --cov=agente \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ env.UMBRAL_COBERTURA_AGENTE }} \
            tests/

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          {
            echo "### Cobertura del agente de visión"
            echo ""
            echo '```'
            coverage report --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  tablero:
    name: Tablero — tipos y construcción
    runs-on: ubuntu-latest
    needs: calidad
    defaults:
      run:
        working-directory: tablero

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tablero/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # tsc en modo estricto actúa como suite de pruebas del frontend: un
      # cambio en el contrato de la API rompe la compilación en lugar de
      # romperse en silencio en pantalla.
      - name: Verificar tipos y construir
        run: npm run build

      - name: Archivar la construcción
        uses: actions/upload-artifact@v4
        with:
          name: tablero-dist
          path: tablero/dist/
          retention-days: 7

  # -------------------------------------------------------------------------
  publicar:
    name: Construir y publicar imagen de la API en GHCR
    runs-on: ubuntu-latest
    needs: [calidad, backend, agente, tablero]
    # Solo se publica desde main: los pull requests únicamente validan.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas y metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Ejecutar las pruebas dentro de la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: pruebas
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: produccion
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar la imagen publicada
        run: |
          # metadata-action normaliza el nombre a minúsculas; se toma la
          # primera etiqueta generada para hacer la prueba de humo.
          IMAGEN=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Verificando $IMAGEN"
          docker run --rm -d --name cerocolas-humo -p 8000:8000 \
            -e DATABASE_URL="sqlite+pysqlite:///./humo.db" \
            -e JWT_SECRETO="humo" "$IMAGEN"
          for intento in $(seq 1 20); do
            if curl -fsS http://localhost:8000/salud; then
              echo "" && echo "La imagen publicada responde correctamente"
              docker rm -f cerocolas-humo
              exit 0
            fi
            sleep 2
          done
          echo "La imagen no respondió en el plazo esperado"
          docker logs cerocolas-humo
          docker rm -f cerocolas-humo
          exit 1
